# AGENTX Gateway: app + Postgres (+ optional Caddy for automatic HTTPS).
#
#   cp .env.example .env     # fill in the required values
#   docker compose up -d --build
#   docker compose --profile tls up -d --build   # adds Caddy (needs GATEWAY_DOMAIN)
#   docker compose --profile search up -d --build  # adds SearXNG for web search (docs/web-search.md)
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentx}
      POSTGRES_DB: ${POSTGRES_DB:-agentx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: agentx-gateway:local
    restart: unless-stopped
    env_file: .env
    environment:
      # docker-entrypoint.sh builds DATABASE_URL from these, percent-encoding each
      # component: Compose string interpolation cannot URL-encode values.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MEDIA_STORAGE_DIR: /data/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback by default: the app trusts X-Forwarded-For for rate limiting, so do
      # not publish it on other interfaces unless Caddy (or your LAN) is the only path.
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    volumes:
      - media-data:/data/media

  searxng:
    # Web search backend for the built-in search tools (docs/web-search.md). Internal only:
    # no published port; the app reaches it at http://searxng:8080 (set SEARXNG_URL to that).
    image: searxng/searxng:2026.11.23-a7163d091
    profiles: ["search"]
    restart: unless-stopped
    environment:
      # Optional: SearXNG signs its cookies with this; the internal instance works without it.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      # Set GATEWAY_DOMAIN in .env to your public domain; "localhost" gives a locally trusted dev cert.
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:
