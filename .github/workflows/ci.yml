name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Throwaway values for build/e2e only. Real secrets never live in CI.
  GATEWAY_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  ADMIN_USERNAME: ci-admin
  ADMIN_PASSWORD: ci-admin-password
  DATABASE_URL: postgres://agentx:agentx@localhost:5432/agentx
  # The default /data/media is not writable on GitHub runners; keep uploads in the checkout.
  MEDIA_STORAGE_DIR: ./data/media

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: agentx
          POSTGRES_DB: agentx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentx -d agentx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the built app
        run: |
          pnpm start > app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Playwright smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            app.log

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
